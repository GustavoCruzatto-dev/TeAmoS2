<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12060f">
    <title>-= Para minha aurorinha =-</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="rodando">
    <canvas id="particulas" aria-hidden="true"></canvas>

    <main class="cena">
        <p class="dedicatoria">Para minha aurorinha</p>

        <div class="palco">
            <div class="brilho" aria-hidden="true"></div>

            <svg class="coracao" viewBox="-10 -10 220 200" role="img" aria-label="Um coração se enchendo de amor">
                <defs>
                    <clipPath id="recorte"><path d="M100 170 C30 120 5 80 5 52 C5 24 27 8 52 8 C72 8 90 20 100 38 C110 20 128 8 148 8 C173 8 195 24 195 52 C195 80 170 120 100 170 Z"/></clipPath>
                    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#ffd1de"/>
                        <stop offset="1" stop-color="#ff7aa5"/>
                    </linearGradient>
                    <linearGradient id="liquido-frente" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#ff8fb1"/>
                        <stop offset="0.55" stop-color="#e8306f"/>
                        <stop offset="1" stop-color="#a3124a"/>
                    </linearGradient>
                </defs>

                <path class="contorno" pathLength="1" d="M100 170 C30 120 5 80 5 52 C5 24 27 8 52 8 C72 8 90 20 100 38 C110 20 128 8 148 8 C173 8 195 24 195 52 C195 80 170 120 100 170 Z"/>

                <g clip-path="url(#recorte)">
                    <g class="liquido">
                        <path class="onda onda-fundo" d="M0 4 Q25 -6 50 4 T100 4 T150 4 T200 4 T250 4 T300 4 T350 4 T400 4 V270 H0 Z" fill="#ffb3c8" fill-opacity="0.5"/>
                        <path class="onda onda-frente" d="M0 7 Q25 -1 50 7 T100 7 T150 7 T200 7 T250 7 T300 7 T350 7 T400 7 V270 H0 Z" fill="url(#liquido-frente)"/>
                    </g>
                </g>

                <path class="vidro" d="M26 44 Q30 24 54 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            </svg>

            <p class="mensagem">Te amo</p>
        </div>

        <p class="promessa">minha princesinha para todo sempre :v</p>
        <button class="de-novo" id="de-novo" type="button">Ver de novo</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
